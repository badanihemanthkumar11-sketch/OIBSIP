<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Authentication System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .card h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #333;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #444;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #667eea;
        }

        .password-info {
            margin-top: 6px;
            font-size: 12px;
            color: #777;
        }

        .btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #667eea;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn:hover {
            background: #5568d8;
        }

        .switch {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }

        .switch button {
            background: none;
            border: none;
            color: #667eea;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }

        .message {
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 6px;
            display: none;
            font-size: 14px;
        }

        .error {
            background: #ffe5e5;
            color: #d32f2f;
        }

        .success {
            background: #e4f7e8;
            color: #2e7d32;
        }

        /* Dashboard */

        .dashboard {
            max-width: 700px;
            width: 100%;
        }

        .dashboard-card {
            background: white;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .dashboard-card h1 {
            color: #333;
            margin-bottom: 15px;
        }

        .welcome {
            font-size: 18px;
            color: #667eea;
            margin-bottom: 25px;
            font-weight: bold;
        }

        .user-box {
            background: #f5f6ff;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
            text-align: left;
        }

        .user-box p {
            margin: 10px 0;
            color: #555;
        }

        .logout-btn {
            padding: 12px 30px;
            background: #e53935;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        .logout-btn:hover {
            background: #c62828;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 500px) {

            .card,
            .dashboard-card {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

    <!-- Authentication Container -->
    <div class="container" id="authContainer">

        <!-- Registration Page -->
        <div class="card" id="registerPage">

            <h1>Create Account</h1>

            <p class="subtitle">
                Register a new account
            </p>

            <div id="registerMessage" class="message"></div>

            <form id="registerForm">

                <div class="form-group">
                    <label for="registerUsername">
                        Username
                    </label>

                    <input
                        type="text"
                        id="registerUsername"
                        placeholder="Enter username"
                        autocomplete="username"
                    >
                </div>

                <div class="form-group">
                    <label for="registerEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="registerEmail"
                        placeholder="Enter email"
                        autocomplete="email"
                    >
                </div>

                <div class="form-group">
                    <label for="registerPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="registerPassword"
                        placeholder="Enter password"
                        autocomplete="new-password"
                    >

                    <p class="password-info">
                        Minimum 8 characters and at least 1 number
                    </p>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm password"
                        autocomplete="new-password"
                    >
                </div>

                <button type="submit" class="btn">
                    Register
                </button>

            </form>

            <div class="switch">
                Already have an account?

                <button onclick="showLogin()">
                    Login
                </button>
            </div>

        </div>


        <!-- Login Page -->
        <div class="card hidden" id="loginPage">

            <h1>Welcome Back</h1>

            <p class="subtitle">
                Login to your account
            </p>

            <div id="loginMessage" class="message"></div>

            <form id="loginForm">

                <div class="form-group">
                    <label for="loginUsername">
                        Username or Email
                    </label>

                    <input
                        type="text"
                        id="loginUsername"
                        placeholder="Enter username or email"
                        autocomplete="username"
                    >
                </div>

                <div class="form-group">
                    <label for="loginPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter password"
                        autocomplete="current-password"
                    >
                </div>

                <button type="submit" class="btn">
                    Login
                </button>

            </form>

            <div class="switch">
                Don't have an account?

                <button onclick="showRegister()">
                    Register
                </button>
            </div>

        </div>

    </div>


    <!-- Protected Dashboard -->
    <div class="dashboard hidden" id="dashboardPage">

        <div class="dashboard-card">

            <h1>Dashboard</h1>

            <p class="welcome" id="welcomeMessage">
                Welcome!
            </p>

            <div class="user-box">

                <p>
                    <strong>Username:</strong>
                    <span id="dashboardUsername"></span>
                </p>

                <p>
                    <strong>Email:</strong>
                    <span id="dashboardEmail"></span>
                </p>

                <p>
                    <strong>Status:</strong>
                    Logged In
                </p>

            </div>

            <button
                class="logout-btn"
                onclick="logout()">
                Logout
            </button>

        </div>

    </div>


    <script>

        /* =====================================================
           STORAGE
        ===================================================== */

        const USERS_KEY = "auth_users";
        const SESSION_KEY = "auth_session";


        // Get registered users
        function getUsers() {

            return JSON.parse(
                localStorage.getItem(USERS_KEY)
            ) || [];

        }


        // Save registered users
        function saveUsers(users) {

            localStorage.setItem(
                USERS_KEY,
                JSON.stringify(users)
            );

        }


        /* =====================================================
           SHA-256 PASSWORD HASHING
        ===================================================== */

        async function hashPassword(password) {

            const encoder =
                new TextEncoder();

            const data =
                encoder.encode(password);

            const hashBuffer =
                await crypto.subtle.digest(
                    "SHA-256",
                    data
                );

            const hashArray =
                Array.from(
                    new Uint8Array(hashBuffer)
                );

            return hashArray
                .map(
                    byte =>
                        byte
                            .toString(16)
                            .padStart(2, "0")
                )
                .join("");

        }


        /* =====================================================
           MESSAGE FUNCTIONS
        ===================================================== */

        function showMessage(
            elementId,
            message,
            type
        ) {

            const element =
                document.getElementById(elementId);

            element.textContent = message;

            element.className =
                "message " + type;

            element.style.display = "block";

        }


        function hideMessage(elementId) {

            const element =
                document.getElementById(elementId);

            element.style.display = "none";

        }


        /* =====================================================
           PAGE NAVIGATION
        ===================================================== */

        function showRegister() {

            document
                .getElementById("loginPage")
                .classList.add("hidden");

            document
                .getElementById("registerPage")
                .classList.remove("hidden");

            hideMessage("loginMessage");

        }


        function showLogin() {

            document
                .getElementById("registerPage")
                .classList.add("hidden");

            document
                .getElementById("loginPage")
                .classList.remove("hidden");

            hideMessage("registerMessage");

        }


        /* =====================================================
           REGISTRATION
        ===================================================== */

        document
            .getElementById("registerForm")
            .addEventListener(
                "submit",
                async function (event) {

                    event.preventDefault();


                    const username =
                        document
                            .getElementById(
                                "registerUsername"
                            )
                            .value
                            .trim();


                    const email =
                        document
                            .getElementById(
                                "registerEmail"
                            )
                            .value
                            .trim()
                            .toLowerCase();


                    const password =
                        document
                            .getElementById(
                                "registerPassword"
                            )
                            .value;


                    const confirmPassword =
                        document
                            .getElementById(
                                "confirmPassword"
                            )
                            .value;


                    hideMessage("registerMessage");


                    /* Basic validation */

                    if (
                        username === "" ||
                        email === "" ||
                        password === "" ||
                        confirmPassword === ""
                    ) {

                        showMessage(
                            "registerMessage",
                            "Please fill in all fields.",
                            "error"
                        );

                        return;
                    }


                    /* Username validation */

                    if (username.length < 3) {

                        showMessage(
                            "registerMessage",
                            "Username must contain at least 3 characters.",
                            "error"
                        );

                        return;
                    }


                    /* Email validation */

                    const emailPattern =
                        /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


                    if (!emailPattern.test(email)) {

                        showMessage(
                            "registerMessage",
                            "Please enter a valid email address.",
                            "error"
                        );

                        return;
                    }


                    /* Password validation */

                    if (password.length < 8) {

                        showMessage(
                            "registerMessage",
                            "Password must contain at least 8 characters.",
                            "error"
                        );

                        return;
                    }


                    /* At least one number */

                    if (!/\d/.test(password)) {

                        showMessage(
                            "registerMessage",
                            "Password must contain at least 1 number.",
                            "error"
                        );

                        return;
                    }


                    /* Confirm password */

                    if (password !== confirmPassword) {

                        showMessage(
                            "registerMessage",
                            "Passwords do not match.",
                            "error"
                        );

                        return;
                    }


                    /* Get existing users */

                    const users = getUsers();


                    /* Duplicate check */

                    const duplicateUser =
                        users.find(
                            user =>
                                user.username.toLowerCase() ===
                                username.toLowerCase() ||

                                user.email.toLowerCase() ===
                                email
                        );


                    if (duplicateUser) {

                        showMessage(
                            "registerMessage",
                            "Username or email already exists.",
                            "error"
                        );

                        return;
                    }


                    /* Hash password */

                    const hashedPassword =
                        await hashPassword(password);


                    /* Create user */

                    const newUser = {

                        id: Date.now(),

                        username: username,

                        email: email,

                        password: hashedPassword

                    };


                    users.push(newUser);


                    saveUsers(users);


                    /* Clear form */

                    document
                        .getElementById("registerForm")
                        .reset();


                    showMessage(
                        "registerMessage",
                        "Registration successful! You can now login.",
                        "success"
                    );


                    setTimeout(
                        () => {

                            showLogin();

                        },
                        1500
                    );

                }
            );


        /* =====================================================
           LOGIN
        ===================================================== */

        document
            .getElementById("loginForm")
            .addEventListener(
                "submit",
                async function (event) {

                    event.preventDefault();


                    const usernameOrEmail =
                        document
                            .getElementById(
                                "loginUsername"
                            )
                            .value
                            .trim();


                    const password =
                        document
                            .getElementById(
                                "loginPassword"
                            )
                            .value;


                    hideMessage("loginMessage");


                    /* Empty validation */

                    if (
                        usernameOrEmail === "" ||
                        password === ""
                    ) {

                        showMessage(
                            "loginMessage",
                            "Please enter username/email and password.",
                            "error"
                        );

                        return;
                    }


                    /* Get users */

                    const users = getUsers();


                    /*
                       Find user by username OR email
                    */

                    const user =
                        users.find(
                            user =>
                                user.username.toLowerCase() ===
                                usernameOrEmail.toLowerCase() ||

                                user.email.toLowerCase() ===
                                usernameOrEmail.toLowerCase()
                        );


                    /*
                       Hash entered password
                    */

                    const hashedPassword =
                        await hashPassword(password);


                    /*
                       IMPORTANT:
                       Same generic error is shown
                       whether username/email or
                       password is incorrect.
                    */

                    if (
                        !user ||
                        user.password !== hashedPassword
                    ) {

                        showMessage(
                            "loginMessage",
                            "Invalid username/email or password.",
                            "error"
                        );

                        return;
                    }


                    /* Create session */

                    const session = {

                        userId: user.id,

                        username: user.username,

                        email: user.email,

                        loginTime:
                            new Date().toLocaleString()

                    };


                    localStorage.setItem(
                        SESSION_KEY,
                        JSON.stringify(session)
                    );


                    /*
                       Show dashboard
                    */

                    showDashboard();

                }
            );


        /* =====================================================
           DASHBOARD
        ===================================================== */

        function showDashboard() {

            const session =
                JSON.parse(
                    localStorage.getItem(SESSION_KEY)
                );


            /*
               If no session exists,
               don't allow dashboard access.
            */

            if (!session) {

                showLogin();

                return;

            }


            document
                .getElementById("authContainer")
                .classList.add("hidden");


            document
                .getElementById("dashboardPage")
                .classList.remove("hidden");


            document
                .getElementById(
                    "welcomeMessage"
                )
                .textContent =
                `Welcome, ${session.username}!`;


            document
                .getElementById(
                    "dashboardUsername"
                )
                .textContent =
                session.username;


            document
                .getElementById(
                    "dashboardEmail"
                )
                .textContent =
                session.email;

        }


        /* =====================================================
           LOGOUT
        ===================================================== */

        function logout() {

            /*
               Remove session
               but keep registered users.
            */

            localStorage.removeItem(
                SESSION_KEY
            );


            document
                .getElementById("dashboardPage")
                .classList.add("hidden");


            document
                .getElementById("authContainer")
                .classList.remove("hidden");


            document
                .getElementById("loginForm")
                .reset();


            showLogin();


            showMessage(
                "loginMessage",
                "You have been logged out successfully.",
                "success"
            );

        }


        /* =====================================================
           CHECK SESSION WHEN PAGE LOADS
        ===================================================== */

        function checkSession() {

            const session =
                localStorage.getItem(
                    SESSION_KEY
                );


            if (session) {

                showDashboard();

            } else {

                showLogin();

            }

        }


        /*
           Run when page loads
        */

        checkSession();

    </script>

</body>

</html>
